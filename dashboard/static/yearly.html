<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepModeling 年度排行</title>
<style>
  :root {
    --bg: #eef0f8;
    --panel: #ffffff;
    --border: #e1e3f2;
    --text: #1e2033;
    --muted: #6b6f8a;
    --accent: #4f5fd9;
    --accent-dark: #3f4bc4;
    --accent-light: #e4e7fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(at top left, #f4f5ff 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  nav a {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent-dark); text-decoration: none; font-size: 14px; font-weight: 600;
    padding: 8px 16px; border-radius: 8px;
    background: var(--accent-light); border: 1px solid #d7dafa;
  }
  nav a:hover { background: #e0e4fb; }
  .caveat { font-size: 13px; color: var(--muted); margin-bottom: 32px; }

  .panel {
    background: radial-gradient(circle farthest-corner at 100% 0%, var(--accent-light) 0%, transparent 100%), var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(31,34,80,0.04);
    padding: 24px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: var(--accent-dark); }
  th.num, td.num { text-align: right; }
  td.login a { color: var(--text); text-decoration: none; }
  td.login a:hover { color: var(--accent-dark); }
  tr:hover td { background: var(--accent-light); }

  .search { margin-bottom: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .search input {
    flex: 1 1 200px; max-width: 280px;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 13px;
  }
  .search select {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 13px;
    color: var(--text); background: var(--panel);
    cursor: pointer; max-width: 220px;
  }
  .search select:focus, .search input:focus { outline: none; border-color: var(--accent); }
  .search .count { font-size: 12px; color: var(--muted); margin-left: auto; }

  .empty, .loading { color: var(--muted); font-size: 13px; padding: 24px 0; }

  /* 页脚说明 */
  .site-footer {
    margin-top: 48px; padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px; line-height: 1.9; color: var(--muted);
  }
  .site-footer .row { margin: 0; }
  .site-footer a { color: var(--accent-dark); text-decoration: none; }
  .site-footer a:hover { text-decoration: underline; }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DeepModeling 年度排行</h1>
    <nav><a href="/">← 返回看板</a></nav>
  </header>
  <div class="caveat">数据范围：过去一年 · 每日重算 · 含 commit 作者（主页面的贡献者排行不含 commit，见首页说明）</div>

  <div class="panel">
    <div class="search">
      <input type="text" id="searchInput" placeholder="搜索用户名…">
      <select id="repoSelect" title="按仓库筛选年度排行">
        <option value="">全部仓库</option>
      </select>
      <span class="count" id="rowCount"></span>
    </div>

    <div id="tableWrap"><div class="loading">加载中…</div></div>
  </div>
  <footer class="site-footer">
    <p class="row">数据来源：DeepModeling 组织下各 GitHub 开源仓库公开记录，
      每日自动抓取汇总，最近更新于 <span id="updatedAt">—</span>。</p>
    <p class="row">统计口径受限于 GitHub API 与抓取窗口，数值仅供参考，不作为考核依据。</p>
    <p class="row">本看板由 AISI 开源社区部门维护，如有疑问或数据勘误，请通过飞书联系 18376072883。</p>
  </footer>
</div>

<script>
let rows = [];
let sortKey = "commits";
let sortDir = -1;

const COLUMNS = [
  { key: "login", label: "贡献者" },
  { key: "commits", label: "Commits", num: true },
  { key: "pr_created", label: "PR 新建", num: true },
  { key: "pr_merged", label: "PR 合并", num: true },
  { key: "pr_reviewed", label: "PR 评审", num: true },
  { key: "issue_created", label: "Issue", num: true },
];

function render() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  let filtered = rows;
  if (q) {
    filtered = rows.filter(r =>
      (r.login || "").toLowerCase().includes(q) || (r.name || "").toLowerCase().includes(q));
  }
  filtered = [...filtered].sort((a, b) => {
    const av = sortKey === "login" ? (a.login || "") : Number(a[sortKey] || 0);
    const bv = sortKey === "login" ? (b.login || "") : Number(b[sortKey] || 0);
    if (av < bv) return -1 * sortDir;
    if (av > bv) return 1 * sortDir;
    return 0;
  });

  const countEl = document.getElementById("rowCount");
  if (countEl) {
    countEl.textContent = filtered.length
      ? `${filtered.length} 位贡献者${selectedRepo ? ` · ${selectedRepo}` : ""}`
      : "";
  }

  if (!filtered.length) {
    document.getElementById("tableWrap").innerHTML = '<div class="empty">没有匹配的贡献者</div>';
    return;
  }

  const thead = COLUMNS.map(c => {
    const active = c.key === sortKey ? (sortDir === 1 ? " ▲" : " ▼") : "";
    return `<th class="${c.num ? 'num' : ''}" data-key="${c.key}">${c.label}${active}</th>`;
  }).join("");

  const tbody = filtered.map(r => {
    const login = r.login
      ? `<a href="${r.github_url}" target="_blank" rel="noopener">${r.login}</a>`
      : (r.name || "(匿名)");
    return `<tr>
      <td class="login">${login}</td>
      <td class="num">${r.commits || 0}</td>
      <td class="num">${r.pr_created || 0}</td>
      <td class="num">${r.pr_merged || 0}</td>
      <td class="num">${r.pr_reviewed || 0}</td>
      <td class="num">${r.issue_created || 0}</td>
    </tr>`;
  }).join("");

  document.getElementById("tableWrap").innerHTML =
    `<table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table>`;

  document.querySelectorAll("th[data-key]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = key === "login" ? 1 : -1; }
      render();
    });
  });
}

let selectedRepo = "";
let repoOptionsFilled = false;
let loadToken = 0;

async function load() {
  const token = ++loadToken;
  document.getElementById("tableWrap").innerHTML = '<div class="loading">加载中…</div>';
  try {
    const p = new URLSearchParams();
    if (selectedRepo) p.set("repo", selectedRepo);
    const res = await fetch(`/api/yearly?${p.toString()}`);
    if (!res.ok) throw new Error(`请求失败：${res.status}`);
    const data = await res.json();
    if (token !== loadToken) return;   // 快速连点下拉时丢弃过期响应

    // by_repo.csv 缺失时后端退回旧格式（纯数组），此时没有仓库维度可筛
    if (Array.isArray(data)) {
      rows = data;
      const sel = document.getElementById("repoSelect");
      sel.disabled = true;
      sel.title = "缺少 by_repo.csv，无法按仓库筛选";
    } else {
      rows = data.rows || [];
      if (!repoOptionsFilled) {
        // 选项只在首次填充：按仓库筛选后返回的 repos 仍是全集，但没必要重复渲染
        const sel = document.getElementById("repoSelect");
        sel.insertAdjacentHTML("beforeend",
          (data.repos || []).map(r => `<option value="${r}">${r}</option>`).join(""));
        sel.value = selectedRepo;
        repoOptionsFilled = true;
      }
    }
    render();
  } catch (e) {
    if (token !== loadToken) return;
    document.getElementById("tableWrap").innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
  }
}

document.getElementById("searchInput").addEventListener("input", render);
document.getElementById("repoSelect").addEventListener("change", (e) => {
  selectedRepo = e.target.value;
  load();
});

// 支持从首页带着仓库跳过来：/yearly?repo=deepmd-kit
(function initFromUrl() {
  const repo = new URLSearchParams(location.search).get("repo");
  if (repo) selectedRepo = repo;
})();

load();

// 页脚的数据更新日期：跟着 by_repo.csv 的实际生成时间走，不写死
(async function loadMeta() {
  try {
    const res = await fetch("/api/meta");
    if (!res.ok) return;
    const m = await res.json();
    if (m.updated_at) document.getElementById("updatedAt").textContent = m.updated_at;
  } catch (e) { /* 拿不到就保持占位符 */ }
})();
</script>
</body>
</html>
